name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor (requires-python) and the version consumers run.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published (v8 onward)
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Before pytest, because this is the one step that needs the network: the suite itself is
      # offline (conftest.py refuses every non-loopback lookup), so the vendored copy of crate's
      # receipt contract is what the tests read. This proves the vendored bytes are the ones
      # crate published at the pinned tag, and that both frozen schema URLs still serve them.
      # Bounded, so a hung fetch cannot hold the job (and its concurrency group) for hours.
      - run: bash tools/crate_receipt_vendor.sh check
        timeout-minutes: 5
      - run: uv run pytest -v --cov=stacs --cov-report=term-missing
