[project]
name = "stacs"
version = "0.1.0"
description = "Register STAC catalogues into pgstac and verify they arrived, by id set and body digest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Allan Irvine", email = "al@newgraphenvironment.com" }
]
# 3.11, matching stac_floodplains_bc: a consumer cannot depend on a package whose floor is
# above its own. CI runs the floor, so the floor is exercised rather than aspirational.
requires-python = ">=3.11"
# Runtime dependencies arrive with the code that needs them, not before.
dependencies = [
    "pystac[validation]>=1.12",
    "requests>=2.31",
    "rfc8785>=0.1.4",
]

[project.scripts]
stacs = "stacs.cli:main"

[project.urls]
Repository = "https://github.com/NewGraphEnvironment/stacs"
Issues = "https://github.com/NewGraphEnvironment/stacs/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
# The documentation site (mkdocs.yml), kept out of the runtime dependencies. MkDocs 2 is
# announced as breaking plugins, so the major is capped.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
# Docstring examples are collected with the tests. The network guard is the root
# conftest.py, so it covers them for any path pytest is given here (not under
# --noconftest, -c or --confcutdir); tests/test_harness.py pins both halves of that.
testpaths = ["tests", "src"]
addopts = ["--doctest-modules"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
